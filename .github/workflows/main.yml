name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == 1) print $2; else print $1}')
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Java version could not be detected."
            exit 1
          fi
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VERSION, which is lower than 17."
            exit 1
          fi
          echo "Java version $JAVA_VERSION is active."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create debug keystore"
            exit 1
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Found files in app/build/outputs/apk:"
            find app/build/outputs/apk -type f || echo "Directory does not exist."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK successfully verified."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(basename "${{ github.repository }}" | tr -cd 'a-zA-Z0-9-')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/$ASSET_NAME"
          echo "ASSET_PATH=$TEMP_DIR/$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.ASSET_PATH }}"
          if [ ! -f "$ASSET_PATH" ]; then
             echo "Error: Prepared release asset not found."
             exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
             echo "Error: Prepared release asset is empty."
             exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          The GitHub Actions run number: ${{ github.run_number }}
          The GitHub Actions run attempt: ${{ github.run_attempt }}
          The source commit SHA: ${{ github.sha }}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG"
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
            REPO_NAME=$(basename "${{ github.repository }}" | tr -cd 'a-zA-Z0-9-')
            ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
            
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            echo "### âœ… APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded from the release Assets section: [Download here]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed."
            echo "The APK build succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available."
            
            echo "### âš ï¸ Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but creating the GitHub Release failed." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named \`app-debug-apk\` remains available as a backup. Check the Actions run artifacts to download it." >> $GITHUB_STEP_SUMMARY
          fi
